<main>
  <h1>Lario</h1>

  @if (isNative) {
    <nav class="tab-bar" data-testid="tab-bar">
      <a
        routerLink="/erfassen"
        routerLinkActive="active"
        data-testid="tab-entry"
      >
        Erfassen
      </a>
      <a routerLink="/eingaben" routerLinkActive="active" data-testid="tab-entries">
        Eingaben
      </a>
      <a
        routerLink="/einrichtung"
        routerLinkActive="active"
        data-testid="tab-setup"
      >
        Einrichtung
      </a>
    </nav>
    <router-outlet />
  } @else {
    <p class="browser-fallback" data-testid="browser-fallback">
      Browser-Vorschau: Der lokale Speicher ist nur in der installierten
      Android-App verfügbar (nicht in der Browser-Vorschau). Die
      Offline-Erfassung funktioniert nur im Android-Paket.
    </p>
  }
</main>
